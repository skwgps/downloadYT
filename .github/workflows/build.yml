name: Build and Release EXE

on:
  release:
    types: [published] # 當你在 GitHub 網頁發布 Release 時自動觸發

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytubefix customtkinter Pillow pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          cd downloadYT
          pyinstaller --noconsole --onefile --add-data "school_logo.png;." file.py

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v1
        with:
          files: downloadYT/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
